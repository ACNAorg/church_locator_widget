name: Publish church locator

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the latest successful widget build
        env:
          GH_TOKEN: ${{ secrets.CHURCH_LOCATOR_ARTIFACT_TOKEN }}
          GH_REPO: ACNAorg/church_locator
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add CHURCH_LOCATOR_ARTIFACT_TOKEN with Actions read access to ACNAorg/church_locator."
            exit 1
          fi
          run_id="$(gh run list --workflow church-map-refresh.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$run_id"
          gh run download "$run_id" --name church-map-widget --dir widget-build
          mkdir widget-release
          for file in index.html widget.css widget.js churches.live.json maps-config.json churches.sample.json; do
            test -s "widget-build/$file"
            cp "widget-build/$file" "widget-release/$file"
          done
          jq -e 'length > 0 and all(.[]; has("expires_at"))' widget-release/churches.live.json >/dev/null
          jq -e '(.key | length > 0) and (.mapId | length > 0)' widget-release/maps-config.json >/dev/null

      - uses: actions/upload-pages-artifact@v5
        with:
          path: widget-release

      - uses: actions/deploy-pages@v5
        id: deployment
