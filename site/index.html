<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Church map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="widget.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="widget.js"></script>
</head>
<body>
  <div class="toolbar">
    <label for="search">Find a church</label>
    <input id="search" type="search" placeholder="Search by name or city" disabled>
    <output id="status" role="status">Loading church locations…</output>
  </div>
  <div id="map" role="region" aria-label="Church locations map"></div>
</body>
</html>
